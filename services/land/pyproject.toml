[project]
name = "farm-land"
version = "0.1.0"
description = "V2 plots, seasons, reservations, crop updates, harvest flow"
requires-python = ">=3.12"
dependencies = [
    "farm-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "geoalchemy2>=0.15",
]

[tool.uv.sources]
farm-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/land_service"]
