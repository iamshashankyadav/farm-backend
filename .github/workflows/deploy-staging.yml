name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - identity
          - catalog
          - land
          - media
          - order
          - logistics
          - notification
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare repository lowercase name
        id: repo
        run: |
          echo "repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repo }}/${{ matrix.service }}:latest
            ghcr.io/${{ steps.repo.outputs.repo }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_staging
          chmod 600 ~/.ssh/id_staging
          ssh-keyscan -p "${{ secrets.STAGING_SSH_PORT || 22 }}" "${{ secrets.STAGING_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync deployment manifests and configuration to Staging VM
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT || 22 }}
        run: |
          ssh -i ~/.ssh/id_staging -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p /opt/farm-backend/infra/traefik /opt/farm-backend/infra/postgres /opt/farm-backend/infra/staging /opt/farm-backend/secrets"
          scp -i ~/.ssh/id_staging -P "$SSH_PORT" docker-compose.staging.yml "$SSH_USER@$SSH_HOST":/opt/farm-backend/
          scp -i ~/.ssh/id_staging -P "$SSH_PORT" infra/traefik/traefik.staging.yml "$SSH_USER@$SSH_HOST":/opt/farm-backend/infra/traefik/
          scp -i ~/.ssh/id_staging -P "$SSH_PORT" infra/traefik/dynamic.staging.yml "$SSH_USER@$SSH_HOST":/opt/farm-backend/infra/traefik/
          scp -i ~/.ssh/id_staging -P "$SSH_PORT" infra/postgres/init-db.sh "$SSH_USER@$SSH_HOST":/opt/farm-backend/infra/postgres/
          scp -i ~/.ssh/id_staging -P "$SSH_PORT" infra/staging/deploy.sh "$SSH_USER@$SSH_HOST":/opt/farm-backend/infra/staging/
          ssh -i ~/.ssh/id_staging -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "chmod +x /opt/farm-backend/infra/staging/deploy.sh /opt/farm-backend/infra/postgres/init-db.sh"

      - name: Execute deployment and health check on Staging VM
        env:
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_PORT: ${{ secrets.STAGING_SSH_PORT || 22 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ssh -i ~/.ssh/id_staging -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -s" << EOF
            set -euo pipefail
            cd /opt/farm-backend

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            export IMAGE_REGISTRY="ghcr.io/$REPO_LOWER"
            export IMAGE_TAG="$SHA"
            ./infra/staging/deploy.sh
          EOF
